<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>石魂 · 博物馆室内实验室</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        :root { --accent: #c2a379; --bg: #1a1a1a; }
        body { margin: 0; background: var(--bg); color: #e0e0e0; font-family: "Noto Serif SC", serif; overflow: hidden; }
        
        #ui-wrapper { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; pointer-events: none; }
        
        /* 左上角模式指示器 */
        #mode-indicator {
            position: absolute; top: 40px; left: 40px; display: none; opacity: 0;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px);
            border-left: 3px solid var(--accent); padding: 10px 20px;
            transition: all 0.5s ease; pointer-events: none;
            box-shadow: -10px 0 20px rgba(0,0,0,0.2);
        }
        .mode-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; margin-bottom: 4px; color: #fff; }
        .mode-status { font-size: 0.95rem; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; color: var(--accent); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #444; transition: 0.3s; }
        .status-dot.active { 
            background: var(--accent); 
            box-shadow: 0 0 12px var(--accent); 
            animation: pulse 2s infinite; 
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.6; } 100% { transform: scale(1); opacity: 1; } }

        /* 右上角重新刻字按钮 */
        #reset-btn-wrapper {
            position: absolute; top: 40px; right: 40px; display: none; opacity: 0;
            transition: all 0.5s ease; pointer-events: auto;
        }
        .secondary-btn {
            margin: 5px 0;
            background: rgba(0, 0, 0, 0.3);
            color: var(--accent); border: 1px solid rgba(194, 163, 121, 0.5); 
            padding: 10px 25px; backdrop-filter: blur(10px);
            font-size: 0.85rem; font-weight: bold; border-radius: 50px;
            cursor: pointer; letter-spacing: 2px;
            transition: 0.3s;
        }
        .secondary-btn:hover { 
            background: var(--accent); color: #1a1a1a;
            box-shadow: 0 0 20px rgba(194, 163, 121, 0.4); 
        }

        /* 评分面板 */
        #score-panel {
            position: absolute; top: 40px; display: none; opacity: 0;
            background: linear-gradient(180deg, rgba(30, 30, 30, 0.9) 0%, rgba(10, 10, 10, 0.95) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(194, 163, 121, 0.3);
            border-top: 2px solid var(--accent);
            border-radius: 4px;
            padding: 25px 60px; text-align: center; width: auto;
            transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 15px rgba(194, 163, 121, 0.1);
        }

        /* 底部 UI */
        #bottom-ui {
            position: absolute; bottom: 40px; display: none; opacity: 0;
            flex-direction: column; align-items: center; gap: 20px;
            transition: all 1s ease; pointer-events: auto;
        }

        #guide-panel {
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50px;
            padding: 10px 30px;
        }

        .save-btn {
            background: linear-gradient(135deg, #d4bb92 0%, #c2a379 100%);
            color: #1a1a1a; border: none; padding: 12px 40px;
            font-size: 1rem; font-weight: bold; border-radius: 50px;
            cursor: pointer; letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(194, 163, 121, 0.4);
            transition: 0.3s;
        }
        .save-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(194, 163, 121, 0.6); }

        .guide-content { display: flex; align-items: center; gap: 20px; color: #ccc; font-size: 0.8rem; letter-spacing: 1px; }
        .guide-item { display: flex; align-items: center; gap: 6px; }
        .guide-dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); }
        
        .score-header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 10px; }
        .score-line { height: 1px; width: 40px; background: linear-gradient(to right, transparent, var(--accent)); }
        .score-line.rev { background: linear-gradient(to left, transparent, var(--accent)); }

        #score-num { 
            font-size: 3.2rem; color: var(--accent); font-weight: 800; margin: 0;
            text-shadow: 0 0 20px rgba(194, 163, 121, 0.5);
            font-family: "Times New Roman", serif;
        }
        #score-eval { font-size: 1.2rem; letter-spacing: 6px; margin: 0 0 15px; color: #fff; font-weight: 300; }
        #quote-text { 
            font-size: 0.95rem; font-style: italic; opacity: 0.8; color: #aaa; 
            max-width: 450px; line-height: 1.8; border-top: 1px dashed rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .glass-panel { 
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            padding: 30px; pointer-events: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center; transition: all 0.5s ease;
        }

        #start-panel button, .tool-bar button { 
            background: var(--accent); color: #121212; border: none; padding: 12px 30px; 
            font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer;
            transition: 0.3s; letter-spacing: 2px;
        }

        #paint-zone { display: none; opacity: 0; flex-direction: column; gap: 20px; }
        canvas#drawing-board { background: #2a2a2a; border-radius: 12px; cursor: crosshair; border: 1px solid #444; }
        .tool-bar { display: flex; justify-content: space-between; align-items: center; gap: 15px; }

        .title-group h1 { font-size: 2rem; margin-bottom: 10px; letter-spacing: 5px; color: var(--accent); }
        .title-group p { font-size: 0.9rem; opacity: 0.7; margin-bottom: 30px; }

        #camera-mask {
            position: fixed; bottom: 25px; right: 25px; width: 180px; height: 135px;
            border-radius: 15px; border: 2px solid var(--accent); overflow: hidden;
            box-shadow: 0 0 25px rgba(194, 163, 121, 0.4); display: none; z-index: 200;
        }
        #video-input { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.6; }
    </style>
</head>
<body>

    <div id="ui-wrapper">
        <div id="mode-indicator">
            <div class="mode-label">Collection View Mode</div>
            <div class="mode-status">
                <div id="status-dot" class="status-dot"></div>
                <span id="mode-text">艺术陈列模式</span>
            </div>
        </div>

        <div id="reset-btn-wrapper">
            <button class="secondary-btn" onclick="resetStudio()">← 重新刻字</button>
            <br>
            <button class="secondary-btn" onclick="gotowd()">← 趣味问答</button>
        </div>

        <div id="score-panel">
            <div class="score-header">
                <div class="score-line"></div>
                <div id="score-num">0</div>
                <div class="score-line rev"></div>
            </div>
            <div id="score-eval">系统评分加载中...</div>
            <div id="quote-text">“入木三分，纸墨相发。”</div>
        </div>

        <div id="bottom-ui">
            <button class="save-btn" onclick="saveSnapshot()">保存藏品快照</button>
            <div id="guide-panel">
                <div class="guide-content">
                    <div class="guide-item"><div class="guide-dot"></div> 手部移动：旋转碑刻</div>
                    <div class="guide-item"><div class="guide-dot"></div> 指尖张合：控制大小</div>
                    <div class="guide-item"><div class="guide-dot"></div> 离开视野：自动进入博物馆模式</div>
                </div>
            </div>
        </div>

        <div id="start-panel" class="glass-panel">
            <div class="title-group">
                <h1>石魂</h1>
                <p>将你的笔触 刻入千年的岩石</p>
            </div>
            <button onclick="enterStudio()">定制你的碑刻画像</button>
        </div>

        <div id="paint-zone" class="glass-panel">
            <canvas id="drawing-board" width="512" height="512"></canvas>
            <div class="tool-bar">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="color" id="colorPicker" value="#c2a379">
                    <input type="range" id="sizePicker" min="1" max="15" value="3">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button style="background: transparent; border: 1px solid var(--accent); color: var(--accent);" onclick="clearCanvas()">清空重描</button>
                    <button onclick="showArtifact()">完成刻绘</button>
                </div>
            </div>
        </div>
    </div>

    <div id="camera-mask">
        <video id="video-input"></video>
    </div>

    <script>
        let scene, camera, renderer, cube, museumGroup, particles;
        let targetRotX = 0, targetRotY = 0, targetScale = 1; 
        let isHandVisible = false;
        let animationId;
        let bgTime = 0; // 用于背景动画计时
        const board = document.getElementById('drawing-board');
        const ctx = board.getContext('2d');
        let isDrawing = false;

        const evaluations = ["笔力惊人", "古朴典雅", "铁画银钩", "气韵生动"];

        ctx.strokeStyle = '#c2a379'; ctx.lineJoin = 'round'; ctx.lineCap = 'round';

        board.onmousedown = (e) => { isDrawing = true; const rect = board.getBoundingClientRect(); ctx.beginPath(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top); };
        board.onmousemove = (e) => { 
            if (!isDrawing) return; 
            const rect = board.getBoundingClientRect();
            ctx.lineWidth = document.getElementById('sizePicker').value;
            ctx.strokeStyle = document.getElementById('colorPicker').value;
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top); ctx.stroke(); 
        };
        window.onmouseup = () => isDrawing = false;

        function clearCanvas() { ctx.clearRect(0, 0, 512, 512); }

        function enterStudio() {
            document.getElementById('start-panel').style.display = 'none';
            const pz = document.getElementById('paint-zone');
            pz.style.display = 'flex'; setTimeout(() => pz.style.opacity = '1', 50);
        }

        function resetStudio() {
            if (animationId) cancelAnimationFrame(animationId);
            if (renderer) {
                document.body.removeChild(renderer.domElement);
                renderer.dispose();
                renderer = null;
            }
            const elementsToHide = ['score-panel', 'bottom-ui', 'mode-indicator', 'reset-btn-wrapper', 'camera-mask'];
            elementsToHide.forEach(id => {
                const el = document.getElementById(id);
                el.style.opacity = '0'; el.style.display = 'none';
            });
            clearCanvas();
            const startPanel = document.getElementById('start-panel');
            startPanel.style.display = 'block';
            setTimeout(() => startPanel.style.opacity = '1', 50);
        }

        function gotowd() {
            window.location.href = './问答环节.html';
        }

        function saveSnapshot() {
            if (!renderer) return;
            renderer.render(scene, camera);
            const link = document.createElement('a');
            link.download = `石魂-我的碑刻-${Date.now()}.png`;
            link.href = renderer.domElement.toDataURL('image/png');
            link.click();
        }

        function showArtifact() {
            document.getElementById('paint-zone').style.display = 'none';
            const sp = document.getElementById('score-panel');
            const bu = document.getElementById('bottom-ui');
            const mi = document.getElementById('mode-indicator');
            const rb = document.getElementById('reset-btn-wrapper');
            document.getElementById('score-num').innerText = Math.floor(Math.random() * 11) + 89;
            document.getElementById('score-eval').innerText = evaluations[Math.floor(Math.random() * evaluations.length)];
            sp.style.display = 'block'; bu.style.display = 'flex'; mi.style.display = 'block'; rb.style.display = 'block';
            setTimeout(() => { sp.style.opacity = '1'; bu.style.opacity = '1'; mi.style.opacity = '1'; rb.style.opacity = '1'; }, 100);
            init3D(); 
            if(!window.handsInitialized) { initGestureRecognition(); window.handsInitialized = true; } 
            else { document.getElementById('camera-mask').style.display = 'block'; }
        }

        function initGestureRecognition() {
            const videoElement = document.getElementById('video-input');
            document.getElementById('camera-mask').style.display = 'block';
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
            hands.onResults((results) => {
                const modeText = document.getElementById('mode-text');
                const statusDot = document.getElementById('status-dot');
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    isHandVisible = true;
                    if(modeText) modeText.innerText = "灵动交互模式";
                    if(statusDot) statusDot.classList.add('active');
                    const landmarks = results.multiHandLandmarks[0];
                    targetRotY = (landmarks[8].x - 0.5) * -2.5;
                    targetRotX = (landmarks[8].y - 0.5) * 1.8;
                    const distance = Math.sqrt(Math.pow(landmarks[8].x - landmarks[4].x, 2) + Math.pow(landmarks[8].y - landmarks[4].y, 2));
                    targetScale = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(distance, 0.05, 0.35, 0.5, 1.6), 0.4, 1.8);
                } else {
                    isHandVisible = false;
                    if(modeText) modeText.innerText = "艺术陈列模式";
                    if(statusDot) statusDot.classList.remove('active');
                    targetRotX = 0; targetRotY = 0; targetScale = 1;
                }
            });
            new Camera(videoElement, { onFrame: async () => { await hands.send({ image: videoElement }); }, width: 640, height: 480 }).start();
        }

        function init3D() {
            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(0x1a1a1a);
            scene.fog = new THREE.Fog(0x2a2a2a, 5, 25);
            camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const texture = new THREE.CanvasTexture(board);
            const sideMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.85 });
            const frontMat = new THREE.MeshStandardMaterial({ map: texture, color: 0x333333, bumpMap: texture, bumpScale: 0.06 });
            cube = new THREE.Mesh(new THREE.BoxGeometry(2, 2.8, 0.4), [sideMat, sideMat, sideMat, sideMat, frontMat, sideMat]);
            cube.position.y = 1.8; cube.castShadow = true; scene.add(cube);

            museumGroup = new THREE.Group();
            const pedestal = new THREE.Mesh(new THREE.BoxGeometry(3, 0.6, 1.8), new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.1, metalness: 0.6 }));
            pedestal.position.y = 0.3; museumGroup.add(pedestal);
            const room = new THREE.Mesh(new THREE.BoxGeometry(20, 15, 20), new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.BackSide }));
            room.position.y = 7.5; room.receiveShadow = true; museumGroup.add(room);
            
            const starGeom = new THREE.BufferGeometry();
            const starCoords = []; for(let i=0; i<800; i++) starCoords.push((Math.random()-0.5)*15, Math.random()*10, (Math.random()-0.5)*15);
            starGeom.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
            particles = new THREE.Points(starGeom, new THREE.PointsMaterial({ color: 0xc2a379, size: 0.015, transparent: true, opacity: 0.5 }));
            museumGroup.add(particles);
            scene.add(museumGroup);

            const mainSpot = new THREE.SpotLight(0xffffff, 4); mainSpot.position.set(5, 12, 5); mainSpot.castShadow = true; scene.add(mainSpot);
            scene.add(new THREE.AmbientLight(0x666666, 0.8));
            camera.position.set(0, 3, 9); camera.lookAt(0, 2, 0);

            // 更新背景渐变逻辑
            function updateBackground() {
                if (!isHandVisible) {
                    scene.background.lerp(new THREE.Color(0x1a1a1a), 0.05);
                    return;
                }

                // 判断抓握状态：缩放比例偏离基准值(1.0)
                const isGrasping = Math.abs(targetScale - 1) > 0.1;
                
                if (isGrasping) {
                    bgTime += 0.012; // 控制循环速度
                    // 配色调整：深绿(0x0a1f14) -> 深黄/古金(0x2d240a)
                    const cGreen = new THREE.Color(0x0a1f14); // 墨色青苔
                    const cYellow = new THREE.Color(0x2d240a); // 古法金琥珀
                    const blend = (Math.sin(bgTime) + 1) / 2;
                    const targetColor = cGreen.lerp(cYellow, blend);
                    scene.background.lerp(targetColor, 0.05);
                } else {
                    // 非抓握状态平滑回到沉稳灰
                    scene.background.lerp(new THREE.Color(0x1a1a1a), 0.05);
                }
            }

            function animate() {
                animationId = requestAnimationFrame(animate);
                if(museumGroup) museumGroup.visible = !isHandVisible; 
                updateBackground();
                if(cube) {
                    cube.rotation.y += (targetRotY - cube.rotation.y) * 0.1;
                    cube.rotation.x += (targetRotX - cube.rotation.x) * 0.1;
                    cube.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
                }
                if (particles) particles.rotation.y += 0.0003;
                renderer.render(scene, camera);
            }
            animate();
        }

        window.onresize = () => {
            if(!camera || !renderer) return;
            camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
